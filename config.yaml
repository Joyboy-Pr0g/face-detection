image:
  max_side: 1280 #keeps sizes consistent and the timing comparable.

haar:
  cascade: models/haarcascade_frontalface_default.xml
  scale_factor: 1.1
  min_neighbors: 5
  min_size: [30, 30]

yolo:
  weights: models/yolov8n-face.pt
  conf: 0.25
  nms_iou: 0.45
  imgsz: 640
  device: cpu

enhance:
  brightness_beta: 30
  contrast_alpha: 1.3
  clahe_clip: 2.0
  clahe_tile: [8, 8]

eval:
  iou_thr: 0.5

timing:
  warmup_runs: 3
  repeats: 5